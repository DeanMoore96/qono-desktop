name: Build Qono installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: qono-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  # A failure here (including the macos-14 runner limit, support ticket
  # 4997291) must not block the Windows release. See docs/RELEASING.md.
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: qono-mac
          path: release/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-mac]
    if: ${{ always() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: qono-*
          merge-multiple: true
      - name: Require Windows update artifacts
        run: |
          test -n "$(ls dist/Qono-Setup-*.exe)"
          test -n "$(ls dist/Qono-Setup-*.exe.blockmap)"
          test -f dist/latest.yml
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Qono ${{ steps.version.outputs.version }}
          body: Qono desktop installers. Windows builds include latest.yml and the blockmap for auto-update.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.dmg
          fail_on_unmatched_files: false
